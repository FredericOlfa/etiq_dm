<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OLFA DM v0.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fffbe1',
                            100: '#fff3b8',
                            500: '#eab308',
                            600: '#ca8a04',
                            700: '#a16207',
                            900: '#422006',
                        },
                        darkbg: '#121212',
                        darkcard: '#1e1e1e',
                        darkinput: '#2a2a2a'
                    }
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { background-color: #0f1115; color: #e5e7eb; font-family: system-ui, -apple-system, sans-serif; }
        #reader video { object-fit: cover !important; border-radius: 0.75rem; }
        .tab-active { border-bottom: 3px solid #eab308; color: #eab308; font-weight: bold; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between select-none pb-16 md:pb-0">

    <header class="bg-darkcard border-b border-gray-800 p-4 sticky top-0 z-50 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="bg-brand-500 text-black p-2 rounded-lg font-bold">
                <i class="fa-solid fa-barcode text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-wide text-white leading-tight">OLFA DataMatrix DMs</h1>
                <p class="text-xs text-gray-400">Impression des étiquettes unitaire à partir des Datamatrix de caisse</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <span id="apiStatusBadge" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-900 text-red-200 border border-red-700">
                <span class="w-2 h-2 mr-1.5 bg-red-400 rounded-full animate-pulse"></span> Non Configuré
            </span>
        </div>
    </header>

    <main class="flex-grow max-w-2xl w-full mx-auto p-4 space-y-4">

        <div class="flex border-b border-gray-800 bg-darkcard rounded-t-xl overflow-hidden">
            <button id="tabScanBtn" onclick="switchTab('scan')" class="flex-1 py-3 text-center font-medium text-sm tab-active transition-all">
                <i class="fa-solid fa-camera mr-2"></i>Scanner
            </button>
            <button id="tabHistoryBtn" onclick="switchTab('history')" class="flex-1 py-3 text-center font-medium text-sm text-gray-400 transition-all">
                <i class="fa-solid fa-list-check mr-2"></i>Historique (<span id="histCount">0</span>)
            </button>
            <button id="tabSettingsBtn" onclick="switchTab('settings')" class="flex-1 py-3 text-center font-medium text-sm text-gray-400 transition-all">
                <i class="fa-solid fa-gear mr-2"></i>Config API
            </button>
        </div>

        <section id="panelScan" class="space-y-4">
            <div class="bg-darkcard border border-gray-800 rounded-xl p-3 shadow-inner relative overflow-hidden">
                <div id="reader" class="w-full min-h-[220px] bg-black rounded-lg overflow-hidden flex items-center justify-center">
                    <div id="scanPlaceholder" class="text-center p-6 text-gray-500">
                        <i class="fa-solid fa-qrcode text-5xl mb-3 text-gray-600 animate-bounce"></i>
                        <p class="text-sm">Cliquez sur le bouton ci-dessous pour démarrer le scanner</p>
                    </div>
                </div>

                <div class="mt-3 flex gap-2">
                    <button id="btnToggleCam" onclick="toggleCamera()" class="flex-1 bg-brand-500 hover:bg-brand-600 active:scale-95 text-black font-bold py-3 px-4 rounded-xl flex items-center justify-center">
                        <i class="fa-solid fa-camera text-lg mr-2"></i>
                        <span id="btnCamText">Démarrer la Caméra</span>
                    </button>
                    <button onclick="clearScannedData()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 p-3 rounded-xl border border-gray-700">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
            </div>

            <div class="bg-darkcard border border-gray-800 rounded-xl p-4 shadow-md space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">
                        Code DataMatrix / Barcode Lu
                    </label>
                    <div class="relative">
                        <input type="text" id="codeOutput" oninput="parseGS1Code(false)" placeholder="Scannez ou saisissez un code..." class="w-full bg-darkinput border border-gray-700 rounded-xl px-4 py-3 text-brand-500 font-mono">
                        <button onclick="document.getElementById('codeOutput').focus()" class="absolute right-3 top-3 text-gray-500">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                    </div>
                </div>

                <!-- Parsed GS1 Fields -->
                <div class="grid grid-cols-1 gap-3 p-3 bg-darkbg border border-gray-700 rounded-lg">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">
                            GTIN (14 chiffres)
                        </label>
                        <input type="text" id="gtinField" readonly placeholder="--" class="w-full bg-darkinput border border-gray-600 rounded-lg px-3 py-2 text-sm text-gray-300 font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">
                            Date Fabrication (AAMMJJ)
                        </label>
                        <input type="text" id="dateField" readonly placeholder="--" class="w-full bg-darkinput border border-gray-600 rounded-lg px-3 py-2 text-sm text-gray-300 font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">
                            Lot / Batch
                        </label>
                        <input type="text" id="lotField" readonly placeholder="--" class="w-full bg-darkinput border border-gray-600 rounded-lg px-3 py-2 text-sm text-gray-300 font-mono">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">
                        Quantité à imprimer
                    </label>
                    <input type="number" id="qtyInput" value="1" min="1" class="w-full text-center bg-darkinput border border-gray-700 rounded-xl py-3 text-2xl font-black text-white focus:outline-none focus:border-brand-500">
                    <div class="flex gap-2 justify-center">
                        <button onclick="adjustQty(-10)" class="bg-gray-800 border border-gray-700 text-brand-500 hover:bg-gray-700 active:bg-gray-600 w-14 h-12 rounded-xl text-lg font-bold flex items-center justify-center">
                            -10
                        </button>
                        <button onclick="adjustQty(-1)" class="bg-gray-800 border border-gray-700 text-white hover:bg-gray-700 active:bg-gray-600 w-14 h-12 rounded-xl text-xl font-bold flex items-center justify-center">
                            −
                        </button>
                        <button onclick="adjustQty(1)" class="bg-gray-800 border border-gray-700 text-white hover:bg-gray-700 active:bg-gray-600 w-14 h-12 rounded-xl text-xl font-bold flex items-center justify-center">
                            +
                        </button>
                        <button onclick="adjustQty(10)" class="bg-gray-800 border border-gray-700 text-brand-500 hover:bg-gray-700 active:bg-gray-600 w-14 h-12 rounded-xl text-lg font-bold flex items-center justify-center">
                            +10
                        </button>
                    </div>
                </div>

                <button onclick="sendScanData()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] text-white font-bold py-4 px-6 rounded-xl text-lg shadow-lg flex items-center justify-center">
                    <i class="fa-solid fa-paper-plane mr-2"></i>
                    <span>Imprimer</span>
                </button>
            </div>
        </section>

        <section id="panelHistory" class="hidden space-y-3">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-sm font-semibold text-gray-400 uppercase">Derniers Envois</h2>
                <button onclick="clearHistory()" class="text-xs text-red-400 hover:underline">
                    <i class="fa-solid fa-trash mr-1"></i>Effacer l'historique
                </button>
            </div>
            <div id="historyList" class="space-y-2"></div>
        </section>

        <section id="panelSettings" class="hidden bg-darkcard border border-gray-800 rounded-xl p-4 space-y-4 shadow-md">
            <h2 class="text-md font-bold text-white border-b border-gray-800 pb-2">Configuration du Serveur HTTP</h2>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">URL Endpoint Serveur</label>
                <input type="url" id="apiUrlInput" placeholder="https://api.mon-entreprise.com/v1/scan" class="w-full bg-darkinput border border-gray-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Méthode HTTP</label>
                    <select id="apiMethodSelect" class="w-full bg-darkinput border border-gray-700 rounded-xl px-3 py-3 text-sm text-white focus:outline-none focus:border-brand-500">
                        <option value="POST">POST (JSON)</option>
                        <option value="GET">GET (Query String)</option>
                        <option value="PUT">PUT (JSON)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">ID Appareil / Terminal</label>
                    <input type="text" id="deviceIdInput" placeholder="DEV-MOBILE-01" class="w-full bg-darkinput border border-gray-700 rounded-xl px-3 py-3 text-sm text-white focus:outline-none focus:border-brand-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Imprimante</label>
                <input type="text" id="printerInput" placeholder="Imprimante-01" class="w-full bg-darkinput border border-gray-700 rounded-xl px-3 py-3 text-sm text-white focus:outline-none focus:border-brand-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Étiquette</label>
                <input type="text" id="etiquetteInput" placeholder="Nom ou référence de l'étiquette" class="w-full bg-darkinput border border-gray-700 rounded-xl px-3 py-3 text-sm text-white focus:outline-none focus:border-brand-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Clé API / Token de sécurité (Optional)</label>
                <input type="password" id="apiKeyInput" placeholder="Bearer eyJhbGciOi..." class="w-full bg-darkinput border border-gray-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500">
            </div>

            <div class="pt-2">
                <button onclick="saveSettings()" class="w-full bg-brand-500 hover:bg-brand-600 text-black font-bold py-3 rounded-xl transition-all shadow">
                    <i class="fa-solid fa-floppy-disk mr-2"></i>Enregistrer la Configuration
                </button>
            </div>
        </section>

    </main>

    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-gray-900 border border-gray-700 text-white px-5 py-3 rounded-xl shadow-2xl transition-all duration-300 opacity-0 pointer-events-none">
        <div class="flex items-center gap-2">
            <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
            <span id="toastMsg" class="text-sm font-medium">Notification</span>
        </div>
    </div>

    <script>
        let html5QrcodeScanner = null;
        let isScanning = false;
        let scanHistory = JSON.parse(localStorage.getItem('scan_history') || '[]');
        let parsedData = {
            gtin: null,
            date: null,
            lot: null
        };

        window.addEventListener('DOMContentLoaded', () => {
            loadSettings();
            updateHistoryUI();
        });

        function switchTab(tabName) {
            const tabs = ['scan', 'history', 'settings', 'python'];
            tabs.forEach(t => {
                const panel = document.getElementById('panel' + t.charAt(0).toUpperCase() + t.slice(1));
                const btn = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1) + 'Btn');

                if (t === tabName) {
                    panel.classList.remove('hidden');
                    btn.classList.add('tab-active');
                    btn.classList.remove('text-gray-400');
                } else {
                    panel.classList.add('hidden');
                    btn.classList.remove('tab-active');
                    btn.classList.add('text-gray-400');
                }
            });

            if (tabName !== 'scan' && isScanning) {
                stopCamera();
            }
        }

        function toggleCamera() {
            if (isScanning) {
                stopCamera();
            } else {
                startCamera();
            }
        }

        function startCamera() {
            const config = {
                fps: 15,
                qrbox: { width: 250, height: 250 },
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.DATA_MATRIX,
                    Html5QrcodeSupportedFormats.QR_CODE,
                    Html5QrcodeSupportedFormats.CODE_128
                ]
            };

            html5QrcodeScanner = new Html5Qrcode("reader");
            document.getElementById('scanPlaceholder')?.classList.add('hidden');

            html5QrcodeScanner.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                onScanError
            ).then(() => {
                isScanning = true;
                document.getElementById('btnCamText').innerText = "Arrêter la Caméra";
                document.getElementById('btnToggleCam').classList.replace('bg-brand-500', 'bg-red-600');
                document.getElementById('btnToggleCam').classList.replace('text-black', 'text-white');
            }).catch(err => {
                showToast("Erreur d'accès à la caméra : " + err, "error");
            });
        }

        function stopCamera() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    html5QrcodeScanner.clear();
                    isScanning = false;
                    document.getElementById('btnCamText').innerText = "Démarrer la Caméra";
                    document.getElementById('btnToggleCam').classList.replace('bg-red-600', 'bg-brand-500');
                    document.getElementById('btnToggleCam').classList.replace('text-white', 'text-black');
                }).catch(err => console.error(err));
            }
        }

        function onScanSuccess(decodedText) {
            triggerFeedback();
            document.getElementById('codeOutput').value = decodedText;
            parseGS1Code();
            showToast("DataMatrix scanné avec succès !", "success");
            stopCamera();
        }

        function onScanError() {
        }

        function triggerFeedback() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = "sine";
                osc.frequency.value = 1000;
                gain.gain.value = 0.1;
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch(e) {}

            if (navigator.vibrate) {
                navigator.vibrate(120);
            }
        }

        function parseGS1Code(showFeedback = true) {
            const code = document.getElementById('codeOutput').value.trim();
            
            // Reset fields
            parsedData = { gtin: null, date: null, lot: null };
            document.getElementById('gtinField').value = '';
            document.getElementById('dateField').value = '';
            document.getElementById('lotField').value = '';

            if (!code) return;

            // Parse GS1-128 format: 01{GTIN}11{DATE}10{LOT}
            // Format: 01[14 digits]11[6 digits AAMMJJ]10[variable length lot]
            
            const gs1Pattern = /01(\d{14})11(\d{6})10(.+)/;
            const match = code.match(gs1Pattern);

            if (match) {
                parsedData.gtin = match[1];
                parsedData.date = match[2];
                parsedData.lot = match[3];

                document.getElementById('gtinField').value = parsedData.gtin;
                document.getElementById('dateField').value = formatDate(parsedData.date);
                document.getElementById('lotField').value = parsedData.lot;

                if (showFeedback) showToast("Code GS1 parsé avec succès !", "success");
            } else {
                if (showFeedback) showToast("Format GS1-128 non reconnu. Vérifiez le code.", "error");
            }
        }

        function formatDate(dateStr) {
            // Format AAMMJJ to JJ/MM/AA
            if (dateStr && dateStr.length === 6) {
                const year = dateStr.substring(0, 2);
                const month = dateStr.substring(2, 4);
                const day = dateStr.substring(4, 6);
                return `${day}/${month}/${year}`;
            }
            return dateStr;
        }

        function formatDateForRequest(dateStr) {
            if (!dateStr || dateStr.length !== 6) return dateStr;
            const year = dateStr.substring(0, 2);
            const month = dateStr.substring(2, 4);
            const day = dateStr.substring(4, 6);
            return `${day}.${month}.20${year}`;
        }

        function clearScannedData() {
            document.getElementById('codeOutput').value = '';
            document.getElementById('qtyInput').value = 1;
            parsedData = { gtin: null, date: null, lot: null };
            document.getElementById('gtinField').value = '';
            document.getElementById('dateField').value = '';
            document.getElementById('lotField').value = '';
        }

        function adjustQty(amount) {
            const qtyInput = document.getElementById('qtyInput');
            let current = parseInt(qtyInput.value) || 1;
            if (current == 1 && amount == 10){
                current = 10;
            } else {
                current += amount;
            }
            if (current < 1) current = 1;
            qtyInput.value = current;
        }

        function saveSettings() {
            const apiUrl = document.getElementById('apiUrlInput').value.trim();
            const apiMethod = document.getElementById('apiMethodSelect').value;
            const deviceId = document.getElementById('deviceIdInput').value.trim();
            const printer = document.getElementById('printerInput').value.trim();
            const etiquette = document.getElementById('etiquetteInput').value.trim();
            const apiKey = document.getElementById('apiKeyInput').value.trim();

            localStorage.setItem('cfg_api_url', apiUrl);
            localStorage.setItem('cfg_api_method', apiMethod);
            localStorage.setItem('cfg_device_id', deviceId);
            localStorage.setItem('cfg_printer', printer);
            localStorage.setItem('cfg_etiquette', etiquette);
            localStorage.setItem('cfg_api_key', apiKey);

            updateBadgeStatus();
            showToast("Configuration enregistrée !", "success");
        }

        function loadSettings() {
            document.getElementById('apiUrlInput').value = localStorage.getItem('cfg_api_url') || '';
            document.getElementById('apiMethodSelect').value = localStorage.getItem('cfg_api_method') || 'POST';
            document.getElementById('deviceIdInput').value = localStorage.getItem('cfg_device_id') || 'MOBILE-01';
            document.getElementById('printerInput').value = localStorage.getItem('cfg_printer') || '';
            document.getElementById('etiquetteInput').value = localStorage.getItem('cfg_etiquette') || '';
            document.getElementById('apiKeyInput').value = localStorage.getItem('cfg_api_key') || '';

            updateBadgeStatus();
        }

        function updateBadgeStatus() {
            const url = localStorage.getItem('cfg_api_url');
            const badge = document.getElementById('apiStatusBadge');
            if (url) {
                badge.className = "inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-900 text-emerald-200 border border-emerald-700";
                badge.innerHTML = `<span class="w-2 h-2 mr-1.5 bg-emerald-400 rounded-full"></span> API Prête`;
            } else {
                badge.className = "inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-900 text-red-200 border border-red-700";
                badge.innerHTML = `<span class="w-2 h-2 mr-1.5 bg-red-400 rounded-full animate-pulse"></span> Non Configuré`;
            }
        }

        async function sendScanData() {
            const code = document.getElementById('codeOutput').value.trim();
            const qty = parseInt(document.getElementById('qtyInput').value) || 1;
            const apiUrl = localStorage.getItem('cfg_api_url');
            const method = localStorage.getItem('cfg_api_method') || 'POST';
            const deviceId = localStorage.getItem('cfg_device_id') || 'DEV-MOBILE';
            const printer = localStorage.getItem('cfg_printer') || '';
            const etiquette = localStorage.getItem('cfg_etiquette') || '';
            const apiKey = localStorage.getItem('cfg_api_key') || '';

            if (!code) {
                showToast("Veuillez d'abord scanner un DataMatrix", "error");
                return;
            }

            if (!apiUrl) {
                showToast("Veuillez configurer l'URL de l'API dans les paramètres", "error");
                switchTab('settings');
                return;
            }

            // Include parsed GS1 fields in the payload
            const payload = {
                datamatrix: code,
                qty: qty,
                timestamp: new Date().toISOString(),
                device_id: deviceId,
                printer: printer,
                etiquette: etiquette,
                gtin: parsedData.gtin,
                PUB_SDTPRB_gencod : parsedData.gtin.slice(1),
                DATE_FAB: formatDateForRequest(parsedData.date),
                LOT: parsedData.lot
            };

            const headers = {
                'Content-Type': 'application/json'
            };
            if (apiKey) headers['Authorization'] = apiKey;

            try {
                let response;
                let responseIsOpaque = false;
                if (method === 'GET') {
                    const queryParams = new URLSearchParams(payload).toString();
                    if (apiKey) {
                        response = await fetch(`${apiUrl}?${queryParams}`, { method: 'GET', headers });
                    } else {
                        response = await fetch(`${apiUrl}?${queryParams}`, {
                            method: 'GET',
                            mode: 'no-cors'
                        });
                        responseIsOpaque = response.type === 'opaque';
                    }
                } else {
                    response = await fetch(apiUrl, {
                        method: method,
                        headers: headers,
                        body: JSON.stringify(payload)
                    });
                }

                if (response.ok || responseIsOpaque) {
                    showToast(responseIsOpaque ? "Requête envoyée (réponse non vérifiable par le navigateur)" : "Données envoyées avec succès !", "success");
                    addHistoryItem(code, qty, 'SUCCÈS');
                    clearScannedData();
                } else {
                    showToast(`Erreur HTTP (${response.status})`, "error");
                    addHistoryItem(code, qty, `ÉCHEC (${response.status})`);
                }
            } catch (err) {
                console.error(err);
                showToast("Erreur Réseau : Enregistré dans l'historique local", "error");
                addHistoryItem(code, qty, 'ÉCHEC RÉSEAU');
            }
        }

        function addHistoryItem(code, qty, status) {
            const item = {
                code,
                qty,
                status,
                gtin: parsedData.gtin,
                date: parsedData.date,
                lot: parsedData.lot,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
            };
            scanHistory.unshift(item);
            if (scanHistory.length > 50) scanHistory.pop();
            localStorage.setItem('scan_history', JSON.stringify(scanHistory));
            updateHistoryUI();
        }

        function updateHistoryUI() {
            const container = document.getElementById('historyList');
            document.getElementById('histCount').innerText = scanHistory.length;

            if (scanHistory.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-500 text-sm py-8">Aucun scan enregistré pour le moment.</p>`;
                return;
            }

            container.innerHTML = scanHistory.map(item => {
                const isSuccess = item.status.includes('SUCCÈS');
                return `
                    <div class="bg-darkcard border border-gray-800 p-3 rounded-xl text-sm">
                        <div class="flex items-center justify-between mb-2">
                            <div class="font-mono text-brand-500 font-bold">${escapeHtml(item.code)}</div>
                            <span class="px-2 py-1 text-xs rounded-md font-semibold ${isSuccess ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-red-950 text-red-400 border border-red-800'}">
                                ${item.status}
                            </span>
                        </div>
                        <div class="text-xs text-gray-400 space-y-1">
                            <div>Qté: <span class="text-white font-bold">${item.qty}</span> • ${item.time}</div>
                            ${item.gtin ? `<div>GTIN: <span class="text-gray-300">${escapeHtml(item.gtin)}</span></div>` : ''}
                            ${item.date ? `<div>Date: <span class="text-gray-300">${formatDate(item.date)}</span></div>` : ''}
                            ${item.lot ? `<div>Lot: <span class="text-gray-300">${escapeHtml(item.lot)}</span></div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function clearHistory() {
            scanHistory = [];
            localStorage.removeItem('scan_history');
            updateHistoryUI();
            showToast("Historique effacé", "success");
        }

        function showToast(msg, type = "success") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = msg;
            if (type === "success") {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400";
            } else {
                toastIcon.className = "fa-solid fa-triangle-exclamation text-red-400";
            }

            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        function escapeHtml(text) {
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
